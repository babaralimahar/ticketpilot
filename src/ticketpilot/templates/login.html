{% extends "base.html" %}
{% block title %}Sign in · TicketPilot{% endblock %}
{% block body %}
<div class="panel" style="max-width:420px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="muted">Use an API key with the clerk (agent) or approver (supervisor) role. It is kept in an HttpOnly cookie for 8 hours.</p>
  {% if error %}<p class="note err">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" style="display:grid;gap:10px">
    <label>API key <input type="password" name="api_key" required autocomplete="off"></label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
